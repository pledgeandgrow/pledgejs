name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build must precede typecheck: the package tsconfigs use composite
      # project references, so cross-package imports resolve to the
      # referenced packages' dist/*.d.ts (TS6305 on a clean checkout).
      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Release check (metadata, versions, dist entry points)
        run: pnpm check:release

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The webpack .cjs PSX loader require()s pledgestack-core's built
      # bundle — outside vitest's source aliases — so build core (and its
      # workspace deps via `...`) before running the suite.
      - name: Build core (needed by the webpack loader test)
        run: pnpm --filter "pledgestack-core..." run build

      - name: Run tests
        run: npx vitest run --coverage

  e2e-smoke:
    name: E2E Smoke (pack → scaffold → build → serve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build create-pledge-app
        run: pnpm --filter create-pledge-app run build

      - name: E2E smoke test
        run: node scripts/e2e-smoke.mjs
        timeout-minutes: 15

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        working-directory: packages/core/native
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: packages/core/native
        run: cargo clippy --all-targets -- -D warnings

      - name: Build native addons
        working-directory: packages/core/native
        run: cargo build --verbose

      - name: Run Rust tests
        working-directory: packages/core/native
        run: cargo test --verbose
