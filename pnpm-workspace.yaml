packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  argon2: true
  esbuild: true
  pledgepack: true
  puppeteer: true
minimumReleaseAgeExclude:
  - pledgepack@0.3.3
overrides:
  brace-expansion: ">=5.0.9"
  # minimatch@3.1.5 requires brace-expansion@^1 — exempt it from the v5 pin above
  "minimatch@3.1.5>brace-expansion": "^1.1.7"
  fast-uri: ">=4.1.3"
  esbuild: ">=0.25.0"
  glob: ">=11.0.0"
  nanoid: ">=3.3.18"
  # Advisory pins (pnpm audit --audit-level=high): keep each within the
  # requesters' major so overrides can't break API compatibility.
  "js-yaml@<4": ">=3.15.2 <4"
  "js-yaml@>=4": ">=4.3.2 <5"
  "browserslist@<4.28.7": ">=4.28.7 <5"
  "postcss@>=8 <8.5.23": ">=8.5.23 <9"
  "devalue@<5.9.1": ">=5.9.1 <6"
  "baseline-browser-mapping@<2.11.0": ">=2.11.0 <3"
